name: tests

# The test suite is offline by design, so it needs neither the scientific
# conda stack nor network access. Installing only the pure-Python and
# wheel-available dependencies keeps
# CI to well under a minute; the heavy packages (OpenMM, mdtraj, pdbfixer)
# are imported lazily inside the functions that need them and are exercised
# by the notebooks, not here.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # requests is needed because saxsnmr/__init__ imports fetch.py,
          # which imports it at module level. The rest of the scientific
          # stack is imported lazily inside functions.
          #
          # numpy is capped to match environment.yml. CI should exercise the
          # configuration people actually install, not a newer one -- though
          # the suite does also pass on numpy 2.4.6, so the cap is about the
          # conda/OpenMM stack rather than about this code.
          pip install "numpy<2.4" scipy pandas requests pytest

      - name: Run the offline suite
        # -m "not network" is belt and braces: nothing is marked network
        # today, but a future test that reaches SASBDB must not make CI
        # depend on a third-party server being up.
        run: python -m pytest tests/ -q -m "not network"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Installed directly rather than via a third-party action, so the
      # version is pinned by pyproject's dev extra and there is one less
      # moving part to keep current.
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  notebooks-are-current:
    # The .ipynb files are build output. If someone edits a notebook by hand
    # instead of the generator, the next regeneration silently discards it --
    # so fail here rather than lose the work later.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Regenerate and diff
        run: |
          python tools/make_notebook.py
          if ! git diff --exit-code --stat -- notebooks/; then
            echo "::error::notebooks/ differs from tools/make_notebook.py output."
            echo "Run 'python tools/make_notebook.py' and commit the result."
            exit 1
          fi
